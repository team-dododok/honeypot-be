<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꿀단지 이메일 인증</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(142deg, #FFEEC6 -5.32%, #FFD572 84.46%);
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            width: 100%;
            height: auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
        }
        .left {
            flex: 1;
            padding: 40px;
            font-size: 1.5rem;
            color: #333;
        }
        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .verification-text {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .verification-number {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
        }
        .footer {
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #FF5722;
            margin-top: 20px;
        }
        .footer a {
            color: #FF5722;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left">
        <h1>꿀단지</h1>
        <p>이메일 인증을 위해 오른쪽 꿀단지에 들어있는 숫자 5개를 입력해주세요.</p>
    </div>
    <div class="right">
        <div class="verification-text">인증번호</div>
        <div class="verification-number" th:text="${code}" >12345</div>
    </div>
</div>
<div class="footer">
    본 이메일로 가입을 시도한 적이 없다면ㄴ
    <a href="mailto:team.dododok@gmail.com">team.dododok@gmail.com</a>으로 문의해주세요.
</div>
</body>
</html>
